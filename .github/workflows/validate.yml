name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m py_compile parcel_to_mqtt/app/main.py
      - run: npx --yes js-yaml parcel_to_mqtt/config.yaml
      - run: npx --yes js-yaml repository.yaml
      - run: npx --yes js-yaml examples/mushroom-parcel-card.yaml
