configuration:
  dhl_tracking_numbers:
    name: DHL tracking numbers
    description: Optional manual DHL tracking numbers separated by commas.
  dhl_login_code:
    name: DHL login code
    description: Optional dhllogin:// URL from the DHL browser login. The DHL account parcel list is read automatically afterwards.
  hermes_tracking_numbers:
    name: Hermes tracking numbers
    description: One or more Hermes tracking numbers separated by commas.
  gls_tracking_numbers:
    name: GLS tracking numbers
    description: One or more GLS tracking numbers separated by commas. GLS is prepared, but not active yet.
  gls_postal_code:
    name: GLS postal code
    description: Delivery postal code for GLS parcels.
  interval:
    name: Update interval in minutes
    description: Time between provider polls.
  max_parcels:
    name: Maximum parcel entities
    description: Number of parcel slots created through MQTT Discovery.
  log_response_details:
    name: Log response details
    description: Write raw responses to the app log for troubleshooting.
