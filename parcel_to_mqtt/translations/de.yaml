configuration:
  dhl_tracking_numbers:
    name: DHL Sendungsnummern
    description: Optionale manuelle DHL-Sendungsnummern, mit Komma getrennt.
  dhl_login_url:
    name: DHL Login-URL
    description: Diese URL im Chrome-Browser oeffnen, bei DHL einloggen, Developer Console oeffnen, die fehlgeschlagene dhllogin:// Weiterleitung kopieren und unten bei DHL Login-Code einfuegen.
  dhl_login_code:
    name: DHL Login-Code
    description: Hier die komplette dhllogin:// URL aus dem DHL-Browser-Login einfuegen. Danach wird die DHL-Kontoliste automatisch gelesen.
  hermes_tracking_numbers:
    name: Hermes Sendungsnummern
    description: Eine oder mehrere Hermes-Sendungsnummern, mit Komma getrennt.
  gls_tracking_numbers:
    name: GLS Sendungsnummern
    description: Eine oder mehrere GLS-Sendungsnummern, mit Komma getrennt. GLS ist vorbereitet, aber noch nicht aktiv.
  gls_postal_code:
    name: GLS Postleitzahl
    description: Liefer-Postleitzahl fuer GLS-Sendungen.
  interval:
    name: Aktualisierungsintervall in Minuten
    description: Abstand zwischen den Abfragen.
  max_parcels:
    name: Maximale Paket-Entitaeten
    description: Anzahl der Paket-Slots, die per MQTT Discovery angelegt werden.
  log_response_details:
    name: Antwortdetails protokollieren
    description: Schreibt Provider-Anfragen und Antworten maskiert ins Add-on-Log und nach /data/provider_debug.log. Die Datei behaelt maximal 100 Zeilen.
